<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}TTPR Dashboard{% endblock %}</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7fa;
      --surface: #ffffff;
      --surface-2: #fbfcfe;
      --border: #e2e7ef;
      --text: #1c2530;
      --muted: #5b6472;
      --soft: #8993a3;

      --blue: #2f6feb;
      --blue-dark: #1b4fc4;
      --blue-tint: #eaf1ff;

      --pink: #f2a8c9;
      --pink-tint: #fdeaf2;

      --yellow-tint: #fff6d9;

      --sage: #a9c8a0;
      --sage-tint: #eaf3e7;

      --sev-critical-text: #8e1e52;
      --sev-critical-bg: #fbe4f0;
      --sev-critical-dot: #c23a78;

      --sev-high-text: #7a2f58;
      --sev-high-bg: #fceaf3;
      --sev-high-dot: #e6a4c8;

      --sev-medium-text: #7a5900;
      --sev-medium-bg: #fff6d9;
      --sev-medium-dot: #f0c94c;

      --sev-low-text: #2f5a2f;
      --sev-low-bg: #e8f2e4;
      --sev-low-dot: #8fbf83;

      --shadow: 0 10px 28px rgba(28, 37, 48, 0.07);
      --shadow-sm: 0 4px 12px rgba(28, 37, 48, 0.05);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    a { color: inherit; text-decoration: none; }
    .shell {
      max-width: 1320px;
      margin: 0 auto;
      padding: 1.75rem 1.25rem 3rem;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      padding: 0.9rem 1.1rem;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--surface);
      box-shadow: var(--shadow-sm);
      margin-bottom: 1.25rem;
      flex-wrap: wrap;
    }
    .brand { display: flex; flex-direction: column; gap: 0.15rem; }
    .brand strong { font-size: 1.02rem; }
    .brand span { color: var(--muted); font-size: 0.88rem; }
    .nav { display: flex; gap: 0.35rem; flex-wrap: wrap; }
    .nav a {
      padding: 0.55rem 0.9rem;
      border-radius: 999px;
      color: var(--muted);
      font-weight: 600;
      font-size: 0.92rem;
      transition: background 150ms ease, color 150ms ease;
    }
    .nav a.active { background: var(--blue-tint); color: var(--blue-dark); }
    .nav a:hover:not(.active) { background: var(--surface-2); color: var(--text); }

    .hero {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.25rem;
      padding: 1.35rem 1.5rem;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--surface);
      margin-bottom: 1.25rem;
      flex-wrap: wrap;
    }
    .hero.compact { margin-bottom: 1rem; padding: 1.1rem 1.4rem; }
    .eyebrow {
      text-transform: uppercase;
      letter-spacing: 0.14em;
      font-size: 0.72rem;
      color: var(--blue-dark);
      margin: 0 0 0.4rem;
      font-weight: 700;
    }
    h1 { margin: 0; font-size: clamp(1.4rem, 2vw, 1.85rem); }
    .subtle { color: var(--muted); margin: 0.4rem 0 0; max-width: 760px; line-height: 1.5; }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      border-radius: 999px;
      padding: 0.7rem 1.15rem;
      background: var(--blue);
      color: #fff;
      font-weight: 700;
      font-size: 0.94rem;
      border: 1px solid transparent;
      white-space: nowrap;
    }
    .btn:hover { background: var(--blue-dark); }
    .btn.ghost {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn.ghost:hover { background: var(--surface-2); }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 1rem;
      margin-bottom: 1.25rem;
    }
    .stat-card {
      padding: 1.05rem 1.15rem;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--surface);
      box-shadow: var(--shadow-sm);
    }
    .stat-card .num { font-size: 1.7rem; font-weight: 800; margin-bottom: 0.2rem; }
    .stat-card .lbl { color: var(--muted); font-size: 0.9rem; }

    .content-grid {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 1rem;
      margin-bottom: 1rem;
      align-items: start;
    }
    .panel {
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--surface);
      padding: 1.1rem 1.15rem 1.25rem;
      box-shadow: var(--shadow-sm);
    }
    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.85rem;
      font-weight: 700;
      gap: 0.75rem;
      flex-wrap: wrap;
    }
    .panel-header .muted { color: var(--muted); font-weight: 500; font-size: 0.9rem; }

    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
    th, td {
      padding: 0.65rem 0.55rem;
      text-align: left;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }
    th { color: var(--muted); font-weight: 600; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.03em; }
    tbody tr:hover { background: var(--surface-2); }
    tbody tr.hl { background: var(--blue-tint); outline: 2px solid var(--blue); outline-offset: -2px; }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.25rem 0.6rem;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
      background: var(--surface-2);
      color: var(--text);
      white-space: nowrap;
      border: 1px solid var(--border);
    }
    .badge::before {
      content: "";
      width: 0.5rem;
      height: 0.5rem;
      border-radius: 50%;
      background: currentColor;
      flex: none;
    }
    .badge.critical { background: var(--sev-critical-bg); color: var(--sev-critical-text); border-color: transparent; }
    .badge.critical::before { background: var(--sev-critical-dot); }
    .badge.high { background: var(--sev-high-bg); color: var(--sev-high-text); border-color: transparent; }
    .badge.high::before { background: var(--sev-high-dot); }
    .badge.medium { background: var(--sev-medium-bg); color: var(--sev-medium-text); border-color: transparent; }
    .badge.medium::before { background: var(--sev-medium-dot); }
    .badge.low { background: var(--sev-low-bg); color: var(--sev-low-text); border-color: transparent; }
    .badge.low::before { background: var(--sev-low-dot); }
    .badge.kev { background: var(--sev-critical-bg); color: var(--sev-critical-text); border-color: transparent; }
    .badge.kev::before { content: none; }
    .badge.info { background: var(--blue-tint); color: var(--blue-dark); border-color: transparent; }
    .badge.info::before { content: none; }
    .badge-row { display: flex; flex-wrap: wrap; gap: 0.4rem; }

    .chip-row { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.42rem 0.75rem;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      font-weight: 600;
      font-size: 0.86rem;
    }
    .chip.active { background: var(--blue-tint); color: var(--blue-dark); border-color: transparent; }
    .chip:hover:not(.active) { background: var(--surface-2); color: var(--text); }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.8rem 0 1rem;
      color: var(--muted);
      flex-wrap: wrap;
      font-size: 0.92rem;
    }

    .callout {
      display: flex;
      gap: 0.85rem;
      padding: 1rem 1.1rem;
      border-radius: 16px;
      background: var(--blue-tint);
      border: 1px solid transparent;
      align-items: flex-start;
    }
    .callout .icon {
      width: 2rem; height: 2rem; flex: none;
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%;
      background: var(--surface);
      color: var(--blue-dark);
      font-weight: 800;
    }
    .callout p { margin: 0.15rem 0 0; color: var(--muted); line-height: 1.5; }
    .callout strong { color: var(--text); }

    .empty { padding: 1.25rem 0; color: var(--muted); text-align: center; }

    @media (max-width: 980px) {
      .stats-grid, .content-grid { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 720px) {
      .stats-grid, .content-grid { grid-template-columns: 1fr; }
      .topbar, .hero { flex-direction: column; align-items: flex-start; }
      .shell { padding: 1rem; }
    }

    {% block extra_style %}{% endblock %}
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <strong>TTPR Security Dashboard</strong>
        <span>What to fix first, and how, across your public-facing assets</span>
      </div>
      <nav class="nav">
        <a href="{{ url_for('overview') }}" class="{% if request.endpoint == 'overview' %}active{% endif %}">Overview</a>
        <a href="{{ url_for('findings') }}" class="{% if request.endpoint == 'findings' %}active{% endif %}">Findings</a>
        <a href="{{ url_for('assets') }}" class="{% if request.endpoint == 'assets' %}active{% endif %}">Assets</a>
      </nav>
    </header>

    {% block content %}{% endblock %}
  </div>
</body>
</html>

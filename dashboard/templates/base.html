<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>{% block title %}TTPR Dashboard{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; }
    nav a { margin-right: 1rem; }
    table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
    th, td { border: 1px solid #ddd; padding: 0.5rem; text-align: left; vertical-align: top; }
    th { background: #f4f4f4; }
    .sev-critical { color: #b00; font-weight: bold; }
    .sev-high     { color: #d60; font-weight: bold; }
    .sev-medium   { color: #a80; }
    .sev-low      { color: #666; }
    .kev { background: #ffe4e4; color: #b00; padding: 2px 6px; border-radius: 3px; font-size: 0.8em; }
    .card { display: inline-block; padding: 1rem 1.5rem; margin-right: 1rem; border: 1px solid #ddd; border-radius: 6px; }
    .card .num { font-size: 2rem; font-weight: bold; }
    .card .lbl { color: #666; font-size: 0.9rem; }
  </style>
</head>
<body>
  <nav>
    <a href="{{ url_for('overview') }}">Overview</a>
    <a href="{{ url_for('findings') }}">Findings</a>
  </nav>
  <hr>
  {% block content %}{% endblock %}
</body>
</html>

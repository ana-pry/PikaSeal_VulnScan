<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}TTPR Dashboard{% endblock %}</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07111f;
      --panel: rgba(10, 22, 39, 0.92);
      --panel-2: #10203a;
      --text: #e6eefc;
      --muted: #8ea4c6;
      --line: rgba(142, 164, 198, 0.18);
      --accent: #4aa3ff;
      --accent-2: #7c5cff;
      --critical: #ff5d5d;
      --high: #ff9c41;
      --medium: #f7c948;
      --low: #6bdc8b;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, "Segoe UI", Roboto, Arial, sans-serif;
      background: radial-gradient(circle at top left, #102646 0%, var(--bg) 45%, #040913 100%);
      color: var(--text);
      min-height: 100vh;
    }
    a { color: inherit; text-decoration: none; }
    .shell {
      max-width: 1400px;
      margin: 0 auto;
      padding: 2rem 1.25rem 3rem;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 1.25rem;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(7, 16, 31, 0.8);
      backdrop-filter: blur(16px);
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.25);
      margin-bottom: 1.25rem;
    }
    .brand {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }
    .brand strong { font-size: 1rem; }
    .brand span { color: var(--muted); font-size: 0.93rem; }
    .nav { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .nav a {
      padding: 0.7rem 0.95rem;
      border-radius: 999px;
      color: var(--muted);
      transition: 180ms ease;
    }
    .nav a.active, .nav a:hover {
      background: rgba(74, 163, 255, 0.16);
      color: var(--text);
    }
    .subtle {
      color: var(--muted);
      margin: 0.35rem 0 0;
      max-width: 760px;
    }
    .hero {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1.3rem 1.4rem;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: linear-gradient(135deg, rgba(74, 163, 255, 0.16), rgba(124, 92, 255, 0.14));
      margin-bottom: 1.25rem;
    }
    .hero.compact { margin-bottom: 1rem; }
    .eyebrow {
      text-transform: uppercase;
      letter-spacing: 0.2em;
      font-size: 0.74rem;
      color: #8fc7ff;
      margin: 0 0 0.35rem;
      font-weight: 700;
    }
    h1 { margin: 0; font-size: clamp(1.45rem, 2.2vw, 2rem); }
    .subtle { color: var(--muted); margin: 0.35rem 0 0; max-width: 760px; }
    .pill {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 0.7rem 1rem;
      background: var(--panel);
      border: 1px solid var(--line);
      color: var(--text);
      font-weight: 600;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 1rem;
      margin-bottom: 1.25rem;
    }
    .card {
      padding: 1.1rem 1.15rem;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--panel);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
    }
    .card .num { font-size: 1.8rem; font-weight: 700; margin-bottom: 0.25rem; }
    .card .lbl { color: var(--muted); font-size: 0.95rem; }
    .content-grid {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 1rem;
      margin-bottom: 1rem;
    }
    .panel {
      border: 1px solid var(--line);
      border-radius: 22px;
      background: var(--panel);
      padding: 1rem 1rem 1.15rem;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.18);
    }
    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.8rem;
      color: var(--text);
      font-weight: 700;
    }
    .panel-header .muted { color: var(--muted); font-weight: 500; font-size: 0.92rem; }
    .table-wrap { overflow-x: auto; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.94rem;
    }
    th, td {
      padding: 0.7rem 0.6rem;
      text-align: left;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
    }
    th { color: var(--muted); font-weight: 600; }
    tbody tr:hover { background: rgba(255,255,255,0.03); }
    .sev-critical { color: var(--critical); font-weight: 700; }
    .sev-high { color: var(--high); font-weight: 700; }
    .sev-medium { color: var(--medium); font-weight: 700; }
    .sev-low { color: var(--low); font-weight: 700; }
    .badge-row { display: flex; flex-wrap: wrap; gap: 0.4rem; }
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 0.2rem 0.55rem;
      border-radius: 999px;
      font-size: 0.8rem;
      background: rgba(255,255,255,0.08);
      color: #f3f7ff;
      white-space: nowrap;
    }
    .badge.critical { background: rgba(255, 93, 93, 0.18); color: #ffd4d4; }
    .badge.high { background: rgba(255, 156, 65, 0.18); color: #ffe3c8; }
    .badge.medium { background: rgba(247, 201, 72, 0.18); color: #fff4cc; }
    .badge.low { background: rgba(107, 220, 139, 0.18); color: #dffbe8; }
    .badge.kev { background: rgba(255, 93, 93, 0.2); color: #ffd2d2; }
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.85rem 0 1rem;
      color: var(--muted);
      flex-wrap: wrap;
    }
    .sort-links { display: flex; gap: 0.6rem; flex-wrap: wrap; }
    .sort-links a {
      padding: 0.45rem 0.65rem;
      border-radius: 999px;
      border: 1px solid var(--line);
      color: var(--text);
      background: rgba(255,255,255,0.03);
    }
    .sort-links a.active { background: rgba(74,163,255,0.16); color: #dceeff; }
    .empty {
      padding: 1rem 0;
      color: var(--muted);
      text-align: center;
    }
    @media (max-width: 980px) {
      .stats-grid, .content-grid { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 720px) {
      .stats-grid, .content-grid { grid-template-columns: 1fr; }
      .topbar, .hero { flex-direction: column; align-items: flex-start; }
      .shell { padding: 1rem; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <strong>TTPR Security Dashboard</strong>
        <span>Unified view of assets, findings, and scan runs</span>
      </div>
      <nav class="nav">
        <a href="{{ url_for('overview') }}" class="{% if request.endpoint == 'overview' %}active{% endif %}">Overview</a>
        <a href="{{ url_for('findings') }}" class="{% if request.endpoint == 'findings' %}active{% endif %}">Findings</a>
      </nav>
    </header>

    {% block content %}{% endblock %}
  </div>
</body>
</html>
